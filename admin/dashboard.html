<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Siri Sarees Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-touch-icon.png">
    <meta name="theme-color" content="#B8860B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <a class="brand-block" href="../index.html">
          <div class="brand-mark"><img src="../assets/ssd-circle-logo.png" alt="Siri Sarees logo"></div>
          <div>
            <h2>Siri Sarees</h2>
            <p>Admin Panel</p>
          </div>
        </a>

        <nav class="sidebar-nav">
          <a href="dashboard.html" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
          <a href="products.html"><i class="fa-solid fa-list"></i> Products</a>
          <a href="add-product.html"><i class="fa-solid fa-plus"></i> Add Product</a>
          <a href="login.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>Siri Sarees Admin</h1>
          <div class="topbar-chip">Welcome back</div>
        </header>

        <section class="stats-grid">
          <article class="stat-card">
            <span class="stat-label"><i class="fa-solid fa-shirt"></i> Total Products</span>
            <strong>&mdash;</strong>
          </article>
          <article class="stat-card">
            <span class="stat-label"><i class="fa-solid fa-tags"></i> Categories</span>
            <strong>&mdash;</strong>
          </article>
          <article class="stat-card">
            <span class="stat-label"><i class="fa-solid fa-triangle-exclamation"></i> Low Stock</span>
            <strong>&mdash;</strong>
          </article>
        </section>

        <section class="panel-card">
          <div class="panel-header">
            <h3>Recent Products</h3>
            <a href="products.html" class="text-link">View all</a>
          </div>

          <div class="product-list">
            <div class="product-item">
              <p>Loading products from the backend&hellip;</p>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
