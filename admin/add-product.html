<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Product | Siri Sarees Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="../favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-touch-icon.png">
  <meta name="theme-color" content="#B8860B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="admin.css" />
</head>

<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <a class="brand-block" href="../index.html">
        <div class="brand-mark"><img src="../assets/ssd-circle-logo.png" alt="Siri Sarees logo"></div>
        <div>
          <h2>Siri Sarees</h2>
          <p>Admin Panel</p>
        </div>
      </a>

      <nav class="sidebar-nav">
        <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
        <a href="products.html"><i class="fa-solid fa-list"></i> Products</a>
        <a href="add-product.html" class="active"><i class="fa-solid fa-plus"></i> Add Product</a>
        <a href="login.html"><i class="fa-solid fa-arrow-right-from-bracket"></i> Logout</a>
      </nav>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <h1>Add Product</h1>
      </header>

      <section class="panel-card form-card">
        <div class="panel-header">
          <h3>New Product Details</h3>
          <p>This saree is published to the live storefront immediately after saving.</p>
        </div>

        <form class="product-form">
          <div class="form-grid">
            <label>
              Saree Name
              <input type="text" name="name" placeholder="Enter saree name" required />
            </label>
            <label>
              Category
              <input type="text" name="category" placeholder="e.g. Silk" required />
            </label>
            <label>
              Price
              <input type="number" name="price" placeholder="0" step="1" min="0" required />
            </label>
            <label>
              Final Price
              <input type="number" name="final_price" placeholder="Same as price" step="1" min="0" />
            </label>
            <label>
              Stock
              <input type="number" name="stock" placeholder="0" required />
            </label>
          </div>

          <p class="discount-preview" id="discountPreview">Enter price to see discount</p>

          <label>
            Description
            <textarea rows="4" name="description" placeholder="Describe the product"></textarea>
          </label>

          <p class="image-upload-label">Product Images
            <span class="hint">&mdash; the first box is the main photo shown to customers</span>
          </p>
          <div class="image-slot-grid" id="imageSlotGrid"></div>
          <p class="image-count-hint" id="imageSlotHint"></p>
          <input type="file" id="slotFileInput" accept="image/png,image/jpeg,image/webp" hidden />

          <p class="form-status" aria-live="polite"></p>
          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Save Product</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="../config.js"></script>
  <script src="admin.js"></script>
</body>

</html>
