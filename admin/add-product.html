<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Product | Siri Sarees Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">SS</div>
          <div>
            <h2>Siri Sarees</h2>
            <p>Admin Panel</p>
          </div>
        </div>

        <nav class="sidebar-nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="products.html">Products</a>
          <a href="add-product.html" class="active">Add Product</a>
          <a href="login.html">Logout</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>Add Product</h1>
        </header>

        <section class="panel-card form-card">
          <div class="panel-header">
            <h3>New Product Details</h3>
            <p>Frontend-only form placeholder.</p>
          </div>

          <form class="product-form">
            <div class="form-grid">
              <label>
                Saree Name
                <input type="text" name="name" placeholder="Enter saree name" required />
              </label>
              <label>
                Category
                <input type="text" name="category" placeholder="e.g. Silk" required />
              </label>
              <label>
                Price
                <input type="number" name="price" placeholder="0" step="0.01" required />
              </label>
              <label>
                Stock
                <input type="number" name="stock" placeholder="0" required />
              </label>
            </div>

            <label>
              Description
              <textarea rows="4" name="description" placeholder="Describe the product"></textarea>
            </label>

            <label>
              Offer
              <input type="text" name="offer" placeholder="e.g. 10% off" />
            </label>

            <label>
              Image Upload
              <input type="file" name="image" accept="image/png,image/jpeg,image/webp" />
            </label>

            <p class="form-status" aria-live="polite"></p>
            <button type="submit" class="btn btn-primary">Save Product</button>
          </form>
        </section>
      </main>
    </div>

    <script src="admin.js"></script>
  </body>
</html>
