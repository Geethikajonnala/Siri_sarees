<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products | Siri Sarees Admin</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <div class="admin-layout">
      <aside class="sidebar">
        <a class="brand-block" href="../index.html">
          <div class="brand-mark"><img src="../assets/ssd-circle-logo.png" alt="Siri Sarees logo"></div>
          <div>
            <h2>Siri Sarees</h2>
            <p>Admin Panel</p>
          </div>
        </a>

        <nav class="sidebar-nav">
          <a href="dashboard.html">Dashboard</a>
          <a href="products.html" class="active">Products</a>
          <a href="add-product.html">Add Product</a>
          <a href="login.html">Logout</a>
        </nav>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <h1>Products</h1>
          <a href="add-product.html" class="btn btn-primary">Add New Product</a>
        </header>

        <section class="panel-card">
          <div class="panel-header">
            <h3>Product Inventory</h3>
            <p>Loading products from the backend...</p>
          </div>

          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Image</th>
                  <th>Name</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td colspan="6">Loading products from the backend&hellip;</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
