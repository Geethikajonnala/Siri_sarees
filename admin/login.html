<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siri Sarees Admin Login</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="../favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicons/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicons/apple-touch-icon.png">
    <meta name="theme-color" content="#B8860B">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="login-card">
        <a class="brand-mark" href="../index.html"><img src="../assets/ssd-circle-logo.png" alt="Siri Sarees logo"></a>
        <h1>Siri Sarees Admin</h1>
        <p>Manage products, inventory, and offers.</p>

        <form class="login-form">
          <label>
            Email
            <input type="text" placeholder="Enter admin email" />
          </label>

          <label>
            Password
            <input type="password" placeholder="Enter password" />
          </label>

          <button type="submit" class="btn btn-primary"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
          <p class="login-message" aria-live="polite"></p>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="../config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
